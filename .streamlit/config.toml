[server]
# Local only: the data is internal and must not leave this computer.
address = "localhost"
# Dedicated port (not the default 8501, used by other internal Streamlit apps such as DK ATP).
port = 8642
headless = true
enableStaticServing = true
# Assortment / KAM files up to 500 MB (xlsx or csv).
maxUploadSize = 500
maxMessageSize = 500
fileWatcherType = "none"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1F4E78"
font = "sans-serif"
