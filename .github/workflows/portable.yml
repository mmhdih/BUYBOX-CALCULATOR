name: Tests & portable Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create this tag (e.g. v1.0) on the run's commit and publish a release with the zip (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write  # needed only to attach the zip to a GitHub release on v* tags

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  portable:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable package
        run: python portable/build_portable.py --out dist

      - name: Smoke test with the embedded Python
        run: dist\BuyBoxAnalyzer\python\python.exe portable\smoke_test.py dist\BuyBoxAnalyzer\app

      - name: Start the app with the launcher and check health
        shell: pwsh
        run: |
          $env:BUYBOX_NO_BROWSER = "1"
          $env:BUYBOX_PORT = "8599"
          $p = Start-Process -FilePath "dist\BuyBoxAnalyzer\python\python.exe" -ArgumentList "dist\BuyBoxAnalyzer\app\launch.py" -PassThru -RedirectStandardOutput launch.out -RedirectStandardError launch.err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://localhost:8599/_stcore/health -TimeoutSec 3
              if ($r.Content -eq "ok") { $ok = $true; break }
            } catch {}
          }
          Get-Content launch.out, launch.err -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "app did not become healthy" }
          Write-Host "App started OK"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: BuyBoxAnalyzer_portable_win64
          path: dist/BuyBoxAnalyzer
          retention-days: 30

      - name: Attach zip to release (v* tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BuyBoxAnalyzer_portable_win64.zip

      - name: Create tag + release (manual run with release_tag)
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Buy Box Analyzer ${{ inputs.release_tag }}
          body: |
            نسخه پرتابل ویندوز (۶۴ بیتی) — بدون نیاز به نصب.
            1. فایل `BuyBoxAnalyzer_portable_win64.zip` را دانلود و کامل Extract کنید.
            2. روی `BuyBox.bat` دوبار کلیک کنید؛ مرورگر خودکار باز می‌شود.

            Portable Windows x64 build: extract the zip and double-click `BuyBox.bat`.
          files: dist/BuyBoxAnalyzer_portable_win64.zip
